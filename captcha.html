<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Verificación de seguridad</title>


<style>

/* ================================
   GENERAL
================================ */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #111111;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* ================================
   TARJETA
================================ */

.card {

    width: 448px;

    max-width: calc(100% - 30px);

    background: #191919;

    border: 1px solid #333333;

    border-radius: 7px;

    padding: 20px 24px 24px;

}


/* ================================
   TITULO
================================ */

.title {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    font-size: 24px;

    font-weight: 700;

    margin-bottom: 4px;

}


/* ESCUDO */

.shield {

    width: 21px;

    height: 21px;

    stroke: #0a84ff;

    stroke-width: 2;

    fill: none;

    stroke-linecap: round;

    stroke-linejoin: round;

}


/* ================================
   SUBTITULO
================================ */

.subtitle {

    text-align: center;

    color: #8ea7c4;

    font-size: 15px;

    margin-bottom: 26px;

}


/* ================================
   PROBLEMA
================================ */

.question-box {

    height: 120px;

    border: 1px dashed #555555;

    border-radius: 7px;

    background: #292929;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    margin-bottom: 24px;

}


.question {

    font-size: 36px;

    font-weight: 700;

    letter-spacing: 1px;

}


.question-help {

    margin-top: 8px;

    color: #aeb7c4;

    font-size: 14px;

}


/* ================================
   INPUT
================================ */

.answer {

    width: 100%;

    height: 40px;

    background: #292929;

    border: 1px solid #484848;

    border-radius: 6px;

    outline: none;

    text-align: center;

    color: white;

    font-size: 15px;

    margin-bottom: 24px;

}


.answer::placeholder {

    color: #70809a;

}


.answer:focus {

    border-color: #0a84ff;

}


.answer.error {

    border-color: #ff453a;

}


/* ================================
   SLIDER
================================ */

.slider {

    width: 100%;

    height: 56px;

    border-radius: 30px;

    background: #252525;

    position: relative;

    overflow: hidden;

    user-select: none;

    touch-action: none;

    margin-bottom: 9px;

}


/* PARTE AZUL */

.slider-progress {

    position: absolute;

    left: 0;

    top: 0;

    bottom: 0;

    width: 0%;

    background: #0a84ff;

    border-radius: 30px;

    pointer-events: none;

    z-index: 0;

}


/* TEXTO DEL SLIDER */

.slider-text {

    position: absolute;

    left: 0;

    right: 0;

    top: 0;

    bottom: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #626b78;

    font-size: 14px;

    font-weight: 500;

    pointer-events: none;

    z-index: 1;

}


/* BOTON REDONDO */

.slider-button {

    position: absolute;

    left: 4px;

    top: 4px;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #999999;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #222222;

    font-size: 20px;

    font-weight: 700;

    z-index: 3;

    cursor: not-allowed;

    box-shadow:
        0 1px 3px rgba(0,0,0,.3);

}


/* SLIDER ACTIVADO */

.slider.enabled .slider-button {

    background: white;

    color: #0a84ff;

    cursor: grab;

}


.slider.enabled .slider-button:active {

    cursor: grabbing;

}


/* ================================
   TEXTO INFERIOR
================================ */

.slider-help {

    text-align: center;

    color: #6683a5;

    font-size: 13px;

    margin-bottom: 0;

}


/* ================================
   PANTALLA CORRECTO
================================ */

.success-screen {

    width: 100%;

}


/* ICONO */

.success-icon {

    width: 64px;

    height: 64px;

    margin: 0 auto 17px;

    border-radius: 50%;

    background: #246bff;

    display: flex;

    justify-content: center;

    align-items: center;

}


.success-icon svg {

    width: 38px;

    height: 38px;

    fill: none;

    stroke: white;

    stroke-width: 2;

    stroke-linecap: round;

    stroke-linejoin: round;

}


/* TITULO CORRECTO */

.success-title {

    text-align: center;

    color: #1670ff;

    font-size: 26px;

    font-weight: 700;

    margin-bottom: 20px;

}


/* MENSAJE */

.success-message {

    text-align: center;

    color: #eeeeee;

    font-size: 17px;

    margin-bottom: 17px;

}


/* CONTENEDOR DE PROGRESO */

.progress-container {

    width: 100%;

    height: 8px;

    background: #383838;

    border-radius: 10px;

    overflow: hidden;

}


/* BARRA DE CARGA */

.verification-progress {

    width: 0%;

    height: 100%;

    background: #246bff;

    border-radius: 10px;

    transition: width .08s linear;

}


/* ================================
   MÓVIL
================================ */

@media (max-width: 500px) {

    .card {

        width: calc(100% - 24px);

        padding: 18px;

    }

    .title {

        font-size: 22px;

    }

    .question {

        font-size: 32px;

    }

}

</style>

</head>


<body>


<div class="card" id="card">


    <!-- ============================
         TITULO
    ============================= -->

    <div class="title">

        <svg
            class="shield"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M12 3
                   19 6
                   v5
                   c0 4.5-2.8 8.5-7 10
                   c-4.2-1.5-7-5.5-7-10
                   V6
                   l7-3z"
            />

        </svg>

        Verificación de seguridad

    </div>


    <!-- SUBTITULO -->

    <div class="subtitle">

        Resuelva el problema matemático
        y deslice para verificar

    </div>


    <!-- ============================
         PROBLEMA
    ============================= -->

    <div class="question-box">

        <div
            class="question"
            id="question"
        >
            16 + 2 = ?
        </div>


        <div class="question-help">

            Ingrese la respuesta a continuación

        </div>

    </div>


    <!-- ============================
         RESPUESTA
    ============================= -->

    <input

        id="answer"

        class="answer"

        type="number"

        inputmode="numeric"

        placeholder="Ingrese su respuesta"

        autocomplete="off"

    >


    <!-- ============================
         SLIDER
    ============================= -->

    <div
        id="slider"
        class="slider"
    >


        <!-- PARTE AZUL -->

        <div
            id="sliderProgress"
            class="slider-progress"
        ></div>


        <!-- TEXTO -->

        <div
            id="sliderText"
            class="slider-text"
        >

            Deslice para enviar la respuesta

        </div>


        <!-- BOTON -->

        <div
            id="sliderButton"
            class="slider-button"
        >

            →

        </div>

    </div>


    <!-- AYUDA -->

    <div
        id="sliderHelp"
        class="slider-help"
    >

        Primero ingrese su respuesta,
        luego deslice para enviar

    </div>


</div>



<script>


/* ============================================
   LOCALSTORAGE — ver si ya pasó el captcha
============================================ */

(function() {

    // Si ya resolvió el captcha antes, redirigir directo
    if (localStorage.getItem('captcha_completado') === 'true') {
        // Cambia 'intro.html' por la página a la que quieras redirigir
        window.location.href = 'intro.html';
        return;
    }

})();


/* ================================
   VARIABLES
================================ */

let number1;

let number2;

let correctAnswer;

let dragging = false;

let startX = 0;

let startLeft = 4;


/* ELEMENTOS */

const card =
    document.getElementById("card");

const question =
    document.getElementById("question");

const answer =
    document.getElementById("answer");

const slider =
    document.getElementById("slider");

const sliderButton =
    document.getElementById("sliderButton");

const sliderProgress =
    document.getElementById("sliderProgress");

const sliderText =
    document.getElementById("sliderText");

const sliderHelp =
    document.getElementById("sliderHelp");


/* ================================
   GENERAR PROBLEMA
================================ */

function generateQuestion() {


    /*
       Números entre 1 y 12
    */

    number1 =
        Math.floor(Math.random() * 12) + 1;


    number2 =
        Math.floor(Math.random() * 12) + 1;


    /*
       Resultado
    */

    correctAnswer =
        number1 + number2;


    /*
       Mostrar problema
    */

    question.textContent =
        number1 + " + " + number2 + " = ?";


    /*
       Limpiar respuesta
    */

    answer.value = "";

    answer.classList.remove("error");


    /*
       Bloquear slider
    */

    disableSlider();

}


/* ================================
   DESACTIVAR SLIDER
================================ */

function disableSlider() {


    slider.classList.remove("enabled");


    sliderButton.style.left =
        "4px";


    sliderProgress.style.width =
        "0%";


    sliderText.textContent =
        "Deslice para enviar la respuesta";


    sliderHelp.textContent =
        "Primero ingrese su respuesta, luego deslice para enviar";

}


/* ================================
   ACTIVAR SLIDER
================================ */

function enableSlider() {


    slider.classList.add("enabled");


    sliderHelp.textContent =
        "Respuesta correcta. Deslice para verificar";


    sliderText.textContent =
        "Deslice para verificar";

}


/* ================================
   COMPROBAR RESPUESTA
================================ */

answer.addEventListener(
    "input",
    function() {


        const value =
            Number(answer.value);


        /*
           Vacío
        */

        if (answer.value === "") {

            disableSlider();

            return;

        }


        /*
           CORRECTA
        */

        if (value === correctAnswer) {


            answer.classList.remove(
                "error"
            );


            enableSlider();

        }


        /*
           INCORRECTA
        */

        else {


            disableSlider();


            answer.classList.add(
                "error"
            );

        }

    }
);


/* ================================
   INICIAR DRAG
================================ */

function startDrag(clientX) {


    /*
       No funciona si está bloqueado
    */

    if (
        !slider.classList.contains(
            "enabled"
        )
    ) {

        return;

    }


    dragging = true;


    startX = clientX;


    startLeft =
        parseFloat(
            getComputedStyle(
                sliderButton
            ).left
        );

}


/* ================================
   MOVER BOTON
================================ */

function moveDrag(clientX) {


    if (!dragging) {

        return;

    }


    const difference =
        clientX - startX;


    let newLeft =
        startLeft + difference;


    /*
       Límite izquierdo
    */

    const minLeft = 4;


    /*
       Límite derecho
    */

    const maxLeft =
        slider.clientWidth -
        sliderButton.offsetWidth -
        4;


    /*
       Mantener dentro
    */

    newLeft =
        Math.max(
            minLeft,
            Math.min(
                maxLeft,
                newLeft
            )
        );


    /*
       Mover botón
    */

    sliderButton.style.left =
        newLeft + "px";


    /*
       Calcular porcentaje
    */

    const progress =
        (newLeft - minLeft) /
        (maxLeft - minLeft);


    const percentage =
        progress * 100;


    /*
       Mover barra azul
    */

    sliderProgress.style.width =
        percentage + "%";


    /*
       ¿Llegó al final?
    */

    if (
        newLeft >= maxLeft - 3
    ) {

        finishVerification();

    }

}


/* ================================
   SOLTAR BOTON
================================ */

function endDrag() {


    if (!dragging) {

        return;

    }


    dragging = false;


    const maxLeft =
        slider.clientWidth -
        sliderButton.offsetWidth -
        4;


    const currentLeft =
        parseFloat(
            getComputedStyle(
                sliderButton
            ).left
        );


    /*
       Si no llegó al final,
       volver al principio
    */

    if (
        currentLeft <
        maxLeft - 3
    ) {


        sliderButton.style.left =
            "4px";


        sliderProgress.style.width =
            "0%";

    }

}


/* ================================
   VERIFICACIÓN COMPLETADA
================================ */

function finishVerification() {


    dragging = false;


    // === GUARDAR EN LOCALSTORAGE ===
    localStorage.setItem('captcha_completado', 'true');


    /*
       Cambiar TODO el contenido
       de la tarjeta.
    */

    card.innerHTML = `

        <div class="success-screen">


            <!-- ICONO -->

            <div class="success-icon">

                <svg viewBox="0 0 48 48">

                    <circle
                        cx="24"
                        cy="24"
                        r="17">
                    </circle>

                    <path
                        d="M16 24l5 5 11-12">
                    </path>

                </svg>

            </div>


            <!-- TITULO -->

            <div class="success-title">

                ¡Correcto!

            </div>


            <!-- MENSAJE -->

            <div class="success-message">

                Ha completado exitosamente
                la verificación.

            </div>


            <!-- BARRA -->

            <div class="progress-container">

                <div
                    id="verificationProgress"
                    class="verification-progress"
                ></div>

            </div>


        </div>

    `;


    /*
       Obtener barra
    */

    const progress =
        document.getElementById(
            "verificationProgress"
        );


    let percentage = 0;


    /*
       Comenzar carga
    */

    const interval =
        setInterval(function() {


            percentage += 1;


            progress.style.width =
                percentage + "%";


            /*
               Llegó al 100%
            */

            if (
                percentage >= 100
            ) {


                clearInterval(interval);


                /*
                   Pequeña pausa
                   antes de redireccionar
                */

                setTimeout(
                    function() {

                        // Cambia 'intro.html' por la página final
                        window.location.href =
                            "intro.html";


                    },
                    300
                );

            }


        }, 30);

}


/* ================================
   MOUSE
================================ */

sliderButton.addEventListener(
    "mousedown",
    function(e) {

        startDrag(
            e.clientX
        );

    }
);


document.addEventListener(
    "mousemove",
    function(e) {

        moveDrag(
            e.clientX
        );

    }
);


document.addEventListener(
    "mouseup",
    function() {

        endDrag();

    }
);


/* ================================
   TOUCH
   iPHONE / ANDROID
================================ */

sliderButton.addEventListener(
    "touchstart",
    function(e) {


        e.preventDefault();


        startDrag(
            e.touches[0].clientX
        );


    },
    {
        passive: false
    }
);


document.addEventListener(
    "touchmove",
    function(e) {


        if (!dragging) {

            return;

        }


        e.preventDefault();


        moveDrag(
            e.touches[0].clientX
        );


    },
    {
        passive: false
    }
);


document.addEventListener(
    "touchend",
    function() {

        endDrag();

    }
);


/* ================================
   INICIAR
================================ */

generateQuestion();

</script>


</body>

</html>
