<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación de seguridad</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #111111;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* TARJETA */

.card {
    width: 448px;
    max-width: calc(100% - 30px);

    background: #191919;

    border: 1px solid #333333;
    border-radius: 7px;

    padding: 20px 24px 24px;
}


/* TITULO */

.title {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;

    font-size: 24px;
    font-weight: 700;

    margin-bottom: 4px;
}


/* ESCUDO */

.shield {
    width: 20px;
    height: 20px;

    stroke: #0a84ff;
    stroke-width: 2;

    fill: none;
}


/* SUBTITULO */

.subtitle {
    text-align: center;

    color: #8ea7c4;

    font-size: 15px;

    margin-bottom: 26px;
}


/* PROBLEMA */

.question-box {
    height: 120px;

    border: 1px dashed #555;
    border-radius: 7px;

    background: #292929;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    margin-bottom: 24px;
}

.question {
    font-size: 36px;
    font-weight: 700;
}

.question-help {
    margin-top: 8px;

    color: #aeb7c4;

    font-size: 14px;
}


/* INPUT */

.answer {
    width: 100%;
    height: 40px;

    background: #292929;

    border: 1px solid #484848;
    border-radius: 6px;

    outline: none;

    text-align: center;

    color: white;

    font-size: 15px;

    margin-bottom: 24px;
}

.answer::placeholder {
    color: #70809a;
}

.answer:focus {
    border-color: #0a84ff;
}

.answer.error {
    border-color: #ff453a;
}


/* SLIDER */

.slider {
    width: 100%;
    height: 56px;

    border-radius: 30px;

    background: #252525;

    position: relative;

    overflow: hidden;

    user-select: none;
    touch-action: none;

    margin-bottom: 9px;
}


/* PARTE AZUL QUE AVANZA */

.slider-progress {
    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 0%;

    background: #0a84ff;

    border-radius: 30px;

    pointer-events: none;

    transition: width .05s linear;
}


/* TEXTO */

.slider-text {
    position: absolute;

    left: 0;
    right: 0;

    top: 0;
    bottom: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    color: #626b78;

    font-size: 14px;
    font-weight: 500;

    pointer-events: none;

    z-index: 1;
}


/* BOTON */

.slider-button {
    position: absolute;

    left: 4px;
    top: 4px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: #999;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #222;

    font-size: 20px;
    font-weight: 700;

    z-index: 3;

    cursor: not-allowed;

    box-shadow: 0 1px 3px rgba(0,0,0,.3);
}

.slider.enabled .slider-button {
    background: white;

    color: #0a84ff;

    cursor: grab;
}

.slider.enabled .slider-button:active {
    cursor: grabbing;
}


/* AYUDA */

.slider-help {
    text-align: center;

    color: #6683a5;

    font-size: 13px;

    margin-bottom: 0;
}


/* ÉXITO */

.slider.completed .slider-text {
    color: white;
}


/* MÓVIL */

@media (max-width: 500px) {

    .card {
        width: calc(100% - 24px);

        padding: 18px;
    }

    .title {
        font-size: 22px;
    }

    .question {
        font-size: 32px;
    }

}

</style>
</head>


<body>

<div class="card">


    <!-- TITULO -->

    <div class="title">

        <!-- ESCUDO SVG -->

        <svg
            class="shield"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path
                d="M12 3
                   19 6
                   v5
                   c0 4.5-2.8 8.5-7 10
                   c-4.2-1.5-7-5.5-7-10
                   V6
                   l7-3z"
            />
        </svg>

        Verificación de seguridad

    </div>


    <div class="subtitle">
        Resuelva el problema matemático y deslice para verificar
    </div>


    <!-- PROBLEMA -->

    <div class="question-box">

        <div
            class="question"
            id="question"
        >
            16 + 2 = ?
        </div>

        <div class="question-help">
            Ingrese la respuesta a continuación
        </div>

    </div>


    <!-- RESPUESTA -->

    <input
        id="answer"
        class="answer"
        type="number"
        inputmode="numeric"
        placeholder="Ingrese su respuesta"
        autocomplete="off"
    >


    <!-- SLIDER -->

    <div
        id="slider"
        class="slider"
    >

        <!-- AZUL PROGRESIVO -->

        <div
            id="sliderProgress"
            class="slider-progress"
        ></div>


        <!-- TEXTO -->

        <div
            id="sliderText"
            class="slider-text"
        >
            Deslice para enviar la respuesta
        </div>


        <!-- BOTON -->

        <div
            id="sliderButton"
            class="slider-button"
        >
            →
        </div>

    </div>


    <div
        id="sliderHelp"
        class="slider-help"
    >
        Primero ingrese su respuesta, luego deslice para enviar
    </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let number1;
let number2;
let correctAnswer;

let dragging = false;

let startX = 0;
let startLeft = 4;


/* ELEMENTOS */

const question =
    document.getElementById("question");

const answer =
    document.getElementById("answer");

const slider =
    document.getElementById("slider");

const sliderButton =
    document.getElementById("sliderButton");

const sliderProgress =
    document.getElementById("sliderProgress");

const sliderText =
    document.getElementById("sliderText");

const sliderHelp =
    document.getElementById("sliderHelp");


/* =========================================
   GENERAR PROBLEMA
========================================= */

function generateQuestion() {

    number1 =
        Math.floor(Math.random() * 12) + 1;

    number2 =
        Math.floor(Math.random() * 12) + 1;

    correctAnswer =
        number1 + number2;

    question.textContent =
        number1 + " + " + number2 + " = ?";


    answer.value = "";

    answer.classList.remove("error");

    disableSlider();
}


/* =========================================
   DESACTIVAR SLIDER
========================================= */

function disableSlider() {

    slider.classList.remove("enabled");

    sliderButton.style.left = "4px";

    sliderProgress.style.width = "0%";

    sliderText.textContent =
        "Deslice para enviar la respuesta";

    sliderHelp.textContent =
        "Primero ingrese su respuesta, luego deslice para enviar";

}


/* =========================================
   ACTIVAR SLIDER
========================================= */

function enableSlider() {

    slider.classList.add("enabled");

    sliderHelp.textContent =
        "Respuesta correcta. Deslice para verificar";

    sliderText.textContent =
        "Deslice para verificar";

}


/* =========================================
   COMPROBAR RESPUESTA
========================================= */

answer.addEventListener(
    "input",
    function() {

        const value =
            Number(answer.value);


        if (answer.value === "") {

            disableSlider();

            return;
        }


        if (value === correctAnswer) {

            answer.classList.remove("error");

            enableSlider();

        } else {

            disableSlider();

            answer.classList.add("error");

        }

    }
);


/* =========================================
   COMENZAR DRAG
========================================= */

function startDrag(clientX) {

    if (
        !slider.classList.contains("enabled")
    ) {
        return;
    }

    dragging = true;

    startX = clientX;

    startLeft =
        parseFloat(
            getComputedStyle(
                sliderButton
            ).left
        );

}


/* =========================================
   MOVER
========================================= */

function moveDrag(clientX) {

    if (!dragging) {
        return;
    }


    const difference =
        clientX - startX;


    let newLeft =
        startLeft + difference;


    const minLeft = 4;


    const maxLeft =
        slider.clientWidth -
        sliderButton.offsetWidth -
        4;


    newLeft =
        Math.max(
            minLeft,
            Math.min(
                maxLeft,
                newLeft
            )
        );


    sliderButton.style.left =
        newLeft + "px";


    /* =====================================
       CALCULAR PROGRESO
    ===================================== */

    const progress =
        (newLeft - minLeft) /
        (maxLeft - minLeft);


    const percentage =
        progress * 100;


    sliderProgress.style.width =
        percentage + "%";


    /* =====================================
       LLEGÓ AL FINAL
    ===================================== */

    if (
        newLeft >= maxLeft - 3
    ) {

        finishVerification();

    }

}


/* =========================================
   SOLTAR
========================================= */

function endDrag() {

    if (!dragging) {
        return;
    }

    dragging = false;


    const maxLeft =
        slider.clientWidth -
        sliderButton.offsetWidth -
        4;


    const currentLeft =
        parseFloat(
            getComputedStyle(
                sliderButton
            ).left
        );


    /*
       Si no llegó al final,
       vuelve al principio
    */

    if (
        currentLeft <
        maxLeft - 3
    ) {

        sliderButton.style.left =
            "4px";

        sliderProgress.style.width =
            "0%";

    }

}


/* =========================================
   FINALIZAR
========================================= */

function finishVerification() {

    dragging = false;


    const maxLeft =
        slider.clientWidth -
        sliderButton.offsetWidth -
        4;


    sliderButton.style.left =
        maxLeft + "px";


    sliderProgress.style.width =
        "100%";


    sliderText.textContent =
        "✓ Verificación completada";


    sliderHelp.textContent =
        "Verificación completada correctamente";


    slider.classList.add("completed");

    slider.classList.remove("enabled");


    /*
       REDIRECCIÓN
       
       Cambia "siguiente.html"
       por la página que quieras abrir.
    */

    setTimeout(function() {

        window.location.href =
            "siguiente.html";

    }, 500);

}


/* =========================================
   MOUSE
========================================= */

sliderButton.addEventListener(
    "mousedown",
    function(e) {

        startDrag(e.clientX);

    }
);


document.addEventListener(
    "mousemove",
    function(e) {

        moveDrag(e.clientX);

    }
);


document.addEventListener(
    "mouseup",
    function() {

        endDrag();

    }
);


/* =========================================
   TOUCH
========================================= */

sliderButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        startDrag(
            e.touches[0].clientX
        );

    },
    {
        passive: false
    }
);


document.addEventListener(
    "touchmove",
    function(e) {

        if (!dragging) {
            return;
        }

        e.preventDefault();

        moveDrag(
            e.touches[0].clientX
        );

    },
    {
        passive: false
    }
);


document.addEventListener(
    "touchend",
    function() {

        endDrag();

    }
);


/* =========================================
   INICIAR
========================================= */

generateQuestion();

</script>

</body>
</html>
